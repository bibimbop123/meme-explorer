# Pre-commit hooks configuration
# Install: gem install overcommit && overcommit --install
# Run: overcommit --run

# Overcommit configuration
PreCommit:
  ALL:
    quiet: false

  # DISABLED: the `rubocop` gem is not currently in this project's
  # Gemfile (verified - even though .rubocop.yml exists), so this would
  # fail every single commit with "command not found" the moment anyone
  # actually installs overcommit per this file's own instructions above.
  # Add `gem "rubocop"` to the Gemfile's :development group first.
  RuboCop:
    enabled: false
    command: ['bundle', 'exec', 'rubocop']
    on_warn: fail
  
  BundleAudit:
    enabled: true
    command: ['bundle', 'audit', 'check', '--update']
  
  RSpec:
    enabled: false  # Too slow for pre-commit
    description: 'Run RSpec test suite'
  
  TrailingWhitespace:
    enabled: true
    exclude:
      - '**/*.md'
  
  YamlSyntax:
    enabled: true
    description: 'Check YAML syntax'
  
  JsonSyntax:
    enabled: true
    description: 'Check JSON syntax'

# Git commit message format
CommitMsg:
  TextWidth:
    enabled: true
    max_subject_width: 72
    max_body_width: 100
  
  TrailingPeriod:
    enabled: true

# Pre-push hooks
PrePush:
  RSpec:
    enabled: true
    command: ['bundle', 'exec', 'rspec']
    description: 'Run full test suite before push'
  
  # DISABLED: the `brakeman` gem is not currently in this project's
  # Gemfile, so this would fail every push the moment anyone actually
  # installs overcommit. Add `gem "brakeman"` to the Gemfile's
  # :development group first, or rely on BundleAudit's dependency-CVE
  # scanning (pre-commit, above) plus CI's `bundle audit` job
  # (.github/workflows/ci.yml) in the meantime.
  Brakeman:
    enabled: false
    command: ['bundle', 'exec', 'brakeman', '--no-pager']
    description: 'Security vulnerability scanner'
