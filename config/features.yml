# Feature Flags Configuration
#
# Read by lib/feature_flags.rb (FeatureFlags.enabled?/get, genuinely
# used at runtime). Kept intentionally minimal: this file used to list
# ~20 flags (streaks, xp_system, achievements, sound_effects, meme_battles,
# near_miss_mechanics, etc.) for a much larger gamification system that
# was removed from the app during a prior cleanup - only the routes,
# services, CSS, and helper module backing those flags were deleted, not
# the flags themselves, leaving this file describing switches for
# features that no longer exist anywhere in the codebase. There was also
# a whole ProgressiveDisclosureHelper module built on top of this file
# that was never actually registered as a Sinatra helper, so calling its
# methods would have raised NoMethodError even before its flags went
# stale - removed together with this cleanup.
#
# Verify with a real grep for `FeatureFlags.enabled?(...)` /
# `FeatureFlags.get(...)` before adding a flag back here - if nothing
# calls it, it doesn't belong in this file.

features:
  # Core features (always on, not actually flag-gated anywhere - kept
  # here as documentation of what exists, not as a real on/off switch)
  core:
    random_memes: true
    trending: true
    like_button: true
    dark_mode: true
    search: true

  # Only flag genuinely checked at runtime today:
  # views/partials/_simplified_nav.erb gates the leaderboard nav link on
  # this exact key (FeatureFlags.enabled?('gamification.features.leaderboards')).
  gamification:
    features:
      leaderboards: true

  # Analytics (not currently flag-gated by any FeatureFlags.enabled?/get
  # call either - kept as documentation only, same caveat as `core` above)
  analytics:
    activity_tracking: true
    performance_monitoring: true
