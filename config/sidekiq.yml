---
:concurrency: 5
:timeout: 25
:queues:
  - critical
  - default
  - low

# Scheduled jobs configuration
:schedule:
  cache_preload:
    cron: '@reboot'  # Run on application startup
    class: CachePreloadWorker
    description: 'Warm cache with memes on startup'
  cache_refresh:
    cron: '*/10 * * * *'  # PHASE 1: Every 10 minutes (increased from 30 for 2000+ pool)
    class: CacheRefreshWorker
    queue: default
    description: "Refresh meme cache from Reddit API"
    
  # NOTE (Aug 25, 2026): similar_meme_prefetch, subreddit_discovery,
  # image_health_check, leaderboard_update, and activity_aggregation were
  # removed from this schedule. Their worker classes and backing services
  # (SimilarMemePrefetchWorker, SubredditDiscoveryService, ImageHealthService/
  # ImageValidationService, LeaderboardService, activity aggregation) were
  # never implemented, so these cron entries silently failed with
  # "uninitialized constant" every time they fired. Re-add them once the
  # corresponding worker + service files actually exist.

  meme_pool_maintenance:
    cron: '*/5 * * * *'  # PHASE 2: Every 5 minutes to maintain 5,000-meme pool
    class: MemePoolMaintenanceWorker
    queue: default
    description: "Intelligent pool management with tier-based distribution"
    
  database_cleanup:
    cron: '0 * * * *'  # Every hour (recommended for production stability)
    class: DatabaseCleanupWorker
    queue: low
    description: "Remove old broken images and stale data"

production:
  :concurrency: 10

development:
  :concurrency: 2
