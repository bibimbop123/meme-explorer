services:
  - type: web
    name: meme-explorer
    runtime: ruby
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec rackup config.ru -p $PORT
    envVars:
      - key: RACK_ENV
        value: production
      # NOTE (Aug 25, 2026): Do NOT hardcode PORT here. Render auto-injects
      # its own $PORT value per-instance and expects the app to bind to
      # whatever it assigns. A fixed value here conflicts with what Render's
      # edge proxy actually expects, which produces the
      # "New primary port detected: XXXX. Restarting deploy to update
      # network configuration..." cycle - Render force-restarts the running
      # service to reconcile the mismatch, and any request in flight during
      # that restart window gets a 502. startCommand already binds to
      # whatever $PORT Render provides at runtime, so no explicit value is
      # needed (or wanted) here.
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: REDDIT_CLIENT_ID
        value: ${REDDIT_CLIENT_ID}
      - key: REDDIT_CLIENT_SECRET
        value: ${REDDIT_CLIENT_SECRET}
      - key: REDIS_URL
        fromService:
          type: redis
          name: meme-explorer-redis
          property: connectionString
      - key: SIDEKIQ_USERNAME
        generateValue: true
      - key: SIDEKIQ_PASSWORD
        generateValue: true
  
  # Sidekiq Worker Service (P2 Week 3: Background Jobs)
  - type: worker
    name: meme-explorer-worker
    runtime: ruby
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -r ./app.rb -C config/sidekiq.yml
    envVars:
      - key: RACK_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: REDDIT_CLIENT_ID
        value: ${REDDIT_CLIENT_ID}
      - key: REDDIT_CLIENT_SECRET
        value: ${REDDIT_CLIENT_SECRET}
      - key: REDIS_URL
        fromService:
          type: redis
          name: meme-explorer-redis
          property: connectionString
  
  # Redis Service (Required for Sidekiq)
  - type: redis
    name: meme-explorer-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
