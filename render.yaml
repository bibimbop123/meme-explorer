services:
  - type: web
    name: meme-explorer
    runtime: ruby
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec rackup config.ru -p $PORT
    envVars:
      - key: RACK_ENV
        value: production
      # NOTE (Aug 25, 2026): Do NOT hardcode PORT here. Render auto-injects
      # its own $PORT value per-instance and expects the app to bind to
      # whatever it assigns. A fixed value here conflicts with what Render's
      # edge proxy actually expects, which produces the
      # "New primary port detected: XXXX. Restarting deploy to update
      # network configuration..." cycle - Render force-restarts the running
      # service to reconcile the mismatch, and any request in flight during
      # that restart window gets a 502. startCommand already binds to
      # whatever $PORT Render provides at runtime, so no explicit value is
      # needed (or wanted) here.
      - key: BUNDLE_WITHOUT
        value: development:test
      # BUG FIX (Aug 25, 2026): `value: ${REDDIT_CLIENT_ID}` is NOT shell
      # interpolation in a Render Blueprint - Render stores it as the
      # literal string "${REDDIT_CLIENT_ID}", not the actual secret. That
      # meant ENV['REDDIT_CLIENT_ID']/['REDDIT_CLIENT_SECRET'] in production
      # were always set to garbage non-empty placeholder text, so
      # create_fetcher/fetch_oauth_token believed credentials were present,
      # attempted an OAuth token request that always failed, and silently
      # fell back to Reddit's unauthenticated endpoint - which is
      # aggressively rate-limited and kept returning 0 memes (see the
      # repeated "Reddit fetch returned 0 memes" log lines), leaving only
      # the 10-meme local fallback pool to ever render. `sync: false` is
      # the correct way to declare a secret that must be entered manually
      # in the Render dashboard (Environment tab) rather than hardcoded in
      # this file.
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: meme-explorer-redis
          property: connectionString
      - key: SIDEKIQ_USERNAME
        generateValue: true
      - key: SIDEKIQ_PASSWORD
        generateValue: true
  
  # Sidekiq Worker Service (P2 Week 3: Background Jobs)
  - type: worker
    name: meme-explorer-worker
    runtime: ruby
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -r ./app.rb -C config/sidekiq.yml
    envVars:
      - key: RACK_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      # Same fix as the web service above - sync: false prompts for the
      # actual secret in the Render dashboard instead of storing the
      # literal, non-interpolated string "${REDDIT_CLIENT_ID}".
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: meme-explorer-redis
          property: connectionString
  
  # Redis Service (Required for Sidekiq)
  - type: redis
    name: meme-explorer-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
